<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>抽认卡刷题 · 面试备考</title>
<link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
<nav class="nav">
  <a class="brand" href="./index.html">求职<span> · 面试备考</span></a>
  <div class="links">
    <a href="./index.html">首页</a>
    <a href="./questions.html">题库</a>
    <a href="./practice.html">刷题</a>
    <a href="./progress.html">进度</a>
    <a href="./knowledge.html">知识体系</a>
    <a href="./guide/timeline.html">时间线</a>
    <a href="./guide/projects.html">项目 STAR</a>
    <a href="./guide/system-design.html">系统设计</a>
    <a href="./guide/study-path.html">学习路径</a>
    <a href="./guide/resume.html">简历/学历</a>
    <a href="./guide/job-market.html">广州行情</a>
  </div>
  <div class="tools"><button type="button" class="ghost" id="themeBtn" title="切换主题">主题</button></div>
</nav>

<main class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
    <div>
      <h1 style="margin:0 0 4px">抽认卡背题</h1>
      <p class="muted" style="margin:0">先思考口述思路，再点击或按 <span class="kbd">Space</span> 揭晓要点校验，支持快捷键标记掌握度。</p>
    </div>
    <div class="tiny" style="color:var(--text3)">
      快捷键：<span class="kbd">Space</span> 揭晓 · <span class="kbd">1</span> 不会 · <span class="kbd">2</span> 模糊 · <span class="kbd">3</span> 会了 · <span class="kbd">→</span> 下一题
    </div>
  </div>

  <div class="filters">
    <select id="pSection"><option value="">全部章节</option></select>
    <select id="pCat"><option value="">全部分类</option></select>
    <select id="pPri"><option value="">全部优先级</option><option>必背</option><option>重点</option><option>了解</option></select>
    <label><input type="checkbox" id="pPrioritize" checked/> 优先未学/模糊 (简易间隔复习)</label>
    <button type="button" id="pShuffle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      随机洗牌
    </button>
  </div>

  <div class="card flash" id="flash">
    <div class="meta" id="fMeta"></div>
    <div class="q" id="fQ">加载中…</div>
    <div id="fPoints" class="hidden"></div>
    <div class="flash-actions">
      <button type="button" id="fReveal" class="primary span2">
        <span>显示要点</span> <span class="kbd" style="background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.3)">Space</span>
      </button>
      <button type="button" data-mark="未学">不会 <span class="kbd">1</span></button>
      <button type="button" data-mark="模糊">模糊 <span class="kbd">2</span></button>
      <button type="button" data-mark="掌握">会了 <span class="kbd">3</span></button>
      <button type="button" id="fNext">下一题 <span class="kbd">→</span></button>
    </div>
    <p class="tiny" id="fProgress" style="margin-top:20px; color:var(--text3)"></p>
  </div>
</main>

<div class="footer wrap">
  <p>个人面试备考站 · 进度保存在本机浏览器 localStorage，可用导入/导出迁移。</p>
  <p>知识外链：<a href="https://pdai.tech/" target="_blank" rel="noopener">pdai.tech</a>；本站不收录其正文。</p>
</div>

<script src="./data/questions.js"></script>
<script src="./data/details-index.js"></script>
<script src="./data/guide.js"></script>
<script src="./data/knowledge.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/common.js"></script>
<script src="./js/practice.js"></script>
</body>
</html>
