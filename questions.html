<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>题库 · 面试备考</title>
<link rel="stylesheet" href="./css/style.css"/>

</head>
<body>
<nav class="nav">
  <a class="brand" href="./index.html">求职<span> · 面试备考</span></a>
  <div class="links">
    <a href="./index.html">首页</a>
    <a href="./questions.html">题库</a>
    <a href="./practice.html">刷题</a>
    <a href="./progress.html">进度</a>
    <a href="./knowledge.html">知识体系</a>
    <a href="./guide/timeline.html">时间线</a>
    <a href="./guide/projects.html">项目 STAR</a>

    <button type="button" class="ghost" id="themeBtn" title="切换主题">主题</button>
  </div>
</nav>
<main class="wrap">

<h1>题库</h1>
<p class="muted">答案要点直接写在卡片里，默认展开。外链仅作可选「原文参考」。可按章节/分类/优先级/来源/掌握度筛选。</p>
<div class="filters">
  <input type="search" id="qSearch" placeholder="搜索题目…"/>
  <select id="fSection"><option value="">全部章节</option></select>
  <select id="fCat"><option value="">全部分类</option></select>
  <select id="fPri"><option value="">全部优先级</option><option>必背</option><option>重点</option><option>了解</option></select>
  <select id="fSrc"><option value="">全部来源</option></select>
  <select id="fMastery"><option value="">全部掌握度</option><option>未学</option><option>模糊</option><option>掌握</option></select>
  <label><input type="checkbox" id="showPoints" checked/> 显示要点</label>
</div>
<p class="tiny" id="qCount"></p>
<div id="qList"></div>

</main>
<div class="footer wrap">
  <p>个人面试备考站 · 进度保存在本机浏览器 localStorage，可用导入/导出迁移到其他电脑。</p>
  <p>知识体系外链指向 <a href="https://pdai.tech/" target="_blank" rel="noopener">pdai.tech</a>（《Java 全栈知识体系》）；本站不收录其文章正文。题目要点为原创精炼表述。</p>
</div>

<script src="./data/questions.js"></script>
<script src="./data/details-index.js"></script>
<script src="./data/guide.js"></script>
<script src="./data/knowledge.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/common.js"></script>
<script src="./js/questions-page.js"></script>

<script>
document.getElementById('themeBtn')?.addEventListener('click', () => {
  const cur = AppCommon.state.settings.theme || 'system';
  const next = cur === 'light' ? 'dark' : cur === 'dark' ? 'system' : 'light';
  AppCommon.setTheme(next);
  AppCommon.toast('主题：' + ({light:'浅色',dark:'深色',system:'跟随系统'})[next]);
});
</script>
</body>
</html>
